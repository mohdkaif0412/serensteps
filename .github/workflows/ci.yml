name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    # A real Postgres, so `next build` prerenders against actual data rather
    # than the empty fallbacks — this proves the whole pipeline compiles.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: serene
          POSTGRES_PASSWORD: serene
          POSTGRES_DB: serenesteps_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U serene -d serenesteps_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://serene:serene@localhost:5432/serenesteps_ci?schema=public
      # Deterministic values so the build never depends on repo secrets.
      AUTH_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: ci@example.com
      ADMIN_PASSWORD: ci-password
      ADMIN_NAME: CI Admin
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `postinstall` runs `prisma generate`; the explicit call keeps the step
      # visible in the log and guards against a cached install skipping it.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Apply database schema
        run: npx prisma db push --skip-generate

      - name: Seed sample content
        run: npm run db:seed

      - name: Build
        run: npm run build
